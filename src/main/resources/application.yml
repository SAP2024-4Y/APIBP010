spring:
  application:
    name: apibp010

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hospital}
    username: ${SPRING_DATASOURCE_USERNAME:hospital}
    password: ${SPRING_DATASOURCE_PASSWORD:hospital}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  graphql:
    graphiql:
      enabled: true
    schema:
      printer:
        enabled: true

jwt:
  secret: ${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tbWluaW11bS0zMi1jaGFycy1sb25n}
  expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
  default-produces-media-type: application/json

server:
  port: 8080
