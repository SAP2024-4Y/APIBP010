name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:  
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run Checkstyle
        run: mvn --batch-mode checkstyle:check

      - name: Compile (required by SpotBugs)
        run: mvn --batch-mode compile -DskipTests

      - name: Run SpotBugs
        run: mvn --batch-mode spotbugs:check

  build:
    name: Build
    runs-on: ubuntu-latest
    # needs: lint  # Uncomment when lint job is re-enabled

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn --batch-mode compile

      - name: Package (skip tests)
        run: mvn --batch-mode package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    # Testcontainers requires Docker — GitHub-hosted ubuntu-latest includes it.
    # No extra service block needed; Testcontainers manages the PostgreSQL+PostGIS
    # container lifecycle directly via the @Testcontainers annotation.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run unit tests
        run: mvn --batch-mode test -Dgroups="unit"

      - name: Run integration tests
        run: mvn --batch-mode verify -Dgroups="integration" -DskipUnitTests=true
        env:
          # Testcontainers picks these up to prefer the Docker socket on the runner
          TESTCONTAINERS_REUSE_ENABLE: 'false'
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

      - name: Publish test summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: |
            target/surefire-reports/TEST-*.xml
            target/failsafe-reports/TEST-*.xml
          check_name: Test Results
          fail_on_failure: true
